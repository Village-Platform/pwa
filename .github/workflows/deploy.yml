# Builds the PWA and publishes it to GitHub Pages on every push to main (or by hand).
# Project site: https://village-platform.github.io/pwa/  → BASE_PATH=/pwa/.
# With a custom domain later, set the repository variable BASE_PATH to "/" (Settings → Variables).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels the queued one, never a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/pwa/' }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://aghour.dorfsys.com/api/v1/' }}
          VITE_APP_VERSION: ${{ github.sha }}
      # Pages has no rewrites: unknown paths (/pwa/firms/12) get 404.html, so it must be the app too.
      # .nojekyll stops Pages from ignoring files that start with "_".
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
