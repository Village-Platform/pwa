# Checks every pull request (the deploy workflow only runs on main): lint, format, types, tests, build.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          BASE_PATH: /pwa/
